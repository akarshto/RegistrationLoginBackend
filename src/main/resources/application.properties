spring.application.name=RegistrationLoginBackend

# ===============================
# SERVER
# ===============================

# Render provides PORT automatically.
# Locally, it falls back to 8080.
server.port=${PORT:8080}


# ===============================
# DATABASE - MYSQL / AIVEN
# ===============================

spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}


# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.MySQLDialect}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=false


# ===============================
# CORS
# ===============================

app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}


# ===============================
# JWT
# ===============================

app.jwt.secret=${APP_JWT_SECRET}

app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}

app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:jwt}