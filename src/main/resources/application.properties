spring.application.name=RegistrationLoginBackend
server.port=8080

# Database configuration: default to an in-memory H2 database for local development.
# To use MySQL instead, set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER, and HIBERNATE_DIALECT
# in the environment or a .env file before running the app.
spring.datasource.url=${DB_URL:jdbc:h2:mem:registration_login_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.format_sql=true

# --- CORS ---
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:3000}

# --- JWT ---
app.jwt.secret=${APP_JWT_SECRET:ChangeThisSecretKeyToASufficientlyLongRandomValue123!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:3600000}
app.jwt.cookie-name=${APP_JWT_COOKIE_NAME:jwt}
